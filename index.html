<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AstroVis Digital Garden</title>
  <link rel="icon" href="images/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The sidebar tree and page content are built by script.js from content/sections.json -->
  <nav id="sidebar" aria-label="Content">
    <a class="logo" href="#" aria-label="AstroVis home">
      <img id="logo" src="images/logo_AstroVis.png" alt="AstroVis">
    </a>
    <div class="side-scroll">
      <p class="side-title">Content</p>
      <div id="tree"></div>
    </div>
  </nav>

  <main>
    <header class="banner">
      <img src="images/logo_DigitalGarden.png" alt="Digital Garden">
    </header>
    <article id="page"></article>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
